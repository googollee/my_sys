---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  labels:
    app: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: media
  template:
    metadata:
      labels:
        app: media
    spec:
      terminationGracePeriodSeconds: 3600
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        supplementalGroups: [105] # render，访问 /dev/dri/renderD128
      containers:
      - name: media
        image: jellyfin/jellyfin:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        ports:
        - name: http
          containerPort: 8096
          protocol: TCP
        volumeMounts:
        - mountPath: /media
          name: media
        - mountPath: /config
          name: config
        - mountPath: /cache
          name: cache
        env:
        - name: 'HOME'
          value: '/cache'
        - name: 'JELLYFIN_PublishedServerUrl'
          value: 'https://media.zhaohai.li'
        resources:
          limits:
            memory: 2Gi
            devic.es/dri: 1
          requests:
            memory: 512Mi
      volumes:
      - name: media
        hostPath:
          path: /mnt/data/media
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-data
      - name: cache
        emptyDir: {}
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'jellyfin-data'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '10Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: media
spec:
  type: ClusterIP
  selector:
    app: media
  ports:
  - name: http
    port: 8096
    protocol: TCP
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media
spec:
  parentRefs:
  - name: entrypoints
    namespace: gateway
    sectionName: lan-https
  hostnames:
  - 'media.zhaohai.li'
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: media
      port: 8096
