---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mblog
  labels:
    app: mblog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mblog
  template:
    metadata:
      labels:
        app: mblog
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: mblog
        image: codeberg.org/googollee/gotosocial:feat-account-multiple-ids-5070
        imagePullPolicy: Always
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - mountPath: /gotosocial/storage
          name: config
        - mountPath: /etc/ssl/certs
          name: host-certs
          readOnly: true
        - mountPath: /etc/pki/ca-trust/extracted
          name: host-ca-trust
          readOnly: true
        env:
        - name: GTS_HOST
          value: mblog.zhaohai.li
        - name: GTS_DB_TYPE
          value: sqlite
        - name: GTS_DB_ADDRESS
          value: /gotosocial/storage/sqlite.db
        - name: GTS_LETSENCRYPT_ENABLED
          value: 'false'
        - name: GTS_ADVANCED_RATE_LIMIT_REQUESTS
          value: '0'
        - name: GTS_TRUSTED_PROXIES
          value: '10.244.0.255/24,192.168.10.255/24,127.0.0.1/32'
        - name: GTS_ADVANCED_RATE_LIMIT_EXCEPTIONS
          value: '10.244.0.255/24,192.168.10.255/24,127.0.0.1/32'
        - name: TZ
          value: Europe/Berlin
        resources:
          limits:
            memory: 1Gi
          requests:
            memory: 256Mi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: gotosocial-data
      - name: host-certs
        hostPath:
          path: /etc/ssl/certs
          type: Directory
      - name: host-ca-trust
        hostPath:
          path: /etc/pki/ca-trust/extracted
          type: Directory
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'gotosocial-data'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '10Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: mblog
spec:
  type: ClusterIP
  selector:
    app: mblog
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mblog
spec:
  parentRefs:
  - name: entrypoints
    namespace: gateway
    sectionName: lan-https
  hostnames:
  - 'mblog.zhaohai.li'
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: mblog
      port: 8080
