# selinux: $ semanage port -a -t ssh_port_t -p tcp 32022
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhufeng-vm
  labels:
    name: zhufeng-vm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zhufeng-vm
  template:
    metadata:
      labels:
        app: zhufeng-vm
    spec:
      containers:
      - name: zhufeng-vm
        image: qemux/qemu
        env:
        - name: BOOT
          value: 'debian'
        - name: DISK_SIZE
          value: '32G'
        - name: RAM_SIZE
          value: '512M'
        - name: CPU_CORES
          value: '1'
        - name: NETWORK
          value: 'passt'
        - name: USER_PORTS
          value: '22,6666'
        ports:
        - containerPort: 22
          name: ssh
          protocol: TCP
          hostPort: 32022
          hostIP: '192.168.10.2'
        - containerPort: 6666
          name: port
          protocol: TCP
          hostPort: 32023
          hostIP: '192.168.10.2'
        - containerPort: 8006
          name: http
          protocol: TCP
        - containerPort: 5900
          name: vnc
          protocol: TCP
        resources:
          limits:
            devic.es/kvm: 1
        volumeMounts:
        - mountPath: /storage
          name: storage
      terminationGracePeriodSeconds: 120
      volumes:
      - name: storage
        hostPath:
          path: /mnt/data/config/zhufeng-vm
---
apiVersion: v1
kind: Service
metadata:
  name: zhufeng-vm
spec:
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ports:
  - name: http
    port: 8006
    protocol: TCP
    targetPort: 8006
  - name: vnc
    port: 5900
    protocol: TCP
    targetPort: 5900
  selector:
    app: zhufeng-vm
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zhufeng-vm
spec:
  parentRefs:
  - name: entrypoints
    namespace: infra
    sectionName: lan-https
  hostnames:
  - 'zhufeng-vm-console-p.zhaohai.li'
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: zhufeng-vm
      port: 8006
