---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photos
  labels:
    app: photos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: photos
  template:
    metadata:
      labels:
        app: photos
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
        - 1001 # googol, media
        - 105 # render
      containers:
      - name: photos
        image: photoview/photoview:master
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        env:
        - name: TZ
          value: Europe/Berlin
        - name: PHOTOVIEW_LISTEN_IP
          value: 0.0.0.0
        - name: PHOTOVIEW_LISTEN_PORT
          value: '8000'
        - name: PHOTOVIEW_VIDEO_ENCODER
          value: vaapi
        - name: PHOTOVIEW_DATABASE_DRIVER
          value: sqlite
        - name: PHOTOVIEW_SQLITE_PATH
          value: /home/photoview/db.sqlite
        - name: PHOTOVIEW_MEDIA_CACHE
          value: /home/photoview/cache
        - name: HOME
          value: /home/photoview
        - name: MAPBOX_TOKEN
          valueFrom:
            secretKeyRef:
              name: mapbox-token
              key: api-token
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - mountPath: /media/photos/Googol图库
          name: photos
          readOnly: true
        - mountPath: /home/photoview
          name: data
        resources:
          limits:
            memory: 2Gi
            devic.es/dri: 1
          requests:
            memory: 256Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: photos-data-ssd
      - name: photos
        hostPath:
          path: /mnt/data/media/photos/Googol图库
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'photos-data-ssd'
spec:
  storageClassName: 'local-path-ssd'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '100Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: photos
spec:
  type: ClusterIP
  selector:
    app: photos
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: photos
spec:
  parentRefs:
  - name: entrypoints
    namespace: gateway
    sectionName: lan-https
  hostnames:
  - 'photos.zhaohai.li'
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: photos
      port: 8000
