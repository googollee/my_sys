---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-vm
  labels:
    name: dev-vm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dev-vm
  template:
    metadata:
      labels:
        app: dev-vm
    spec:
      hostUsers: false
      containers:
      - name: dev-vm
        image: qemux/qemu
        env:
        - name: BOOT
          value: 'debian'
        - name: DISK_SIZE
          value: '64G'
        - name: DISK_TYPE
          value: 'blk'
        # conflict with seccomp
        # - name: DISK_IO
        #   value: 'io_uring'
        - name: DISK_CACHE
          value: 'none'
        - name: RAM_SIZE
          value: '8G'
        - name: CPU_CORES
          value: '2'
        ports:
        - containerPort: 22
          name: ssh
          protocol: TCP
          hostPort: 32222
          hostIP: '192.168.10.2'
        - containerPort: 8006
          name: http
          protocol: TCP
        - containerPort: 5900
          name: vnc
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
            # NET_ADMIN 建 bridge/tap 和 iptables NAT；NET_BIND_SERVICE、SETUID、SETGID 给 dnsmasq（DHCP、降权）
            add: ['NET_ADMIN', 'NET_BIND_SERVICE', 'SETGID', 'SETUID']
        resources:
          limits:
            devic.es/kvm: 1
            devic.es/tun: 1
          requests:
            memory: 9Gi # RAM_SIZE 8G + QEMU 开销；不设 limit，避免 OOM 杀掉 VM
        volumeMounts:
        - mountPath: /storage
          name: storage
        - mountPath: /var/log/nginx # 镜像中日志文件属 www-data，没有 DAC_OVERRIDE 的 root 写不了
          name: nginx-log
      terminationGracePeriodSeconds: 120
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: dev-vm-data-ssd
      - name: nginx-log
        emptyDir: {}
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'dev-vm-data-ssd'
spec:
  storageClassName: 'local-path-ssd'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '100Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: dev-vm
spec:
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ports:
  - name: http
    port: 8006
    protocol: TCP
    targetPort: 8006
  - name: vnc
    port: 5900
    protocol: TCP
    targetPort: 5900
  selector:
    app: dev-vm
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dev-vm
spec:
  parentRefs:
  - name: entrypoints
    namespace: gateway
    sectionName: lan-https
  hostnames:
  - 'dev-vm-console-p.zhaohai.li'
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: dev-vm
      port: 8006
