apiVersion: apps/v1
kind: Deployment
metadata:
  name: bt
  labels:
    app: bt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bt
  template:
    metadata:
      labels:
        app: bt
    spec:
      terminationGracePeriodSeconds: 3600
      containers:
      - name: bt
        image: linuxserver/qbittorrent:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - mountPath: /media
          name: media
        - mountPath: /config
          name: config
        env:
        - name: "WEBUI_PORT"
          value: "8080"
        - name: "TZ"
          value: "Europe/Berlin"
        - name: "PUID"
          value: "1001"
        - name: "PGID"
          value: "1001"
      volumes:
      - name: media
        hostPath:
          path: /mnt/data/media
      - name: config
        hostPath:
          path: /mnt/data/config/qbittorrent
---
apiVersion: v1
kind: Service
metadata:
  name: bt
spec:
  type: ClusterIP
  selector:
    app: bt
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bt
spec:
  parentRefs:
  - name: entrypoints
    namespace: infra
    sectionName: lan-https
  hostnames:
  - "bt.zhaohai.li"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: bt
      port: 8080
