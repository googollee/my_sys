---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bt
  labels:
    app: bt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bt
  template:
    metadata:
      labels:
        app: bt
    spec:
      hostUsers: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1001 # googol，与 media 属主一致
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: bt
        image: linuxserver/qbittorrent:latest
        imagePullPolicy: Always
        command: ['/app/qbittorrent-nox', '--webui-port=8080']
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - mountPath: /media
          name: media
        - mountPath: /config
          name: config
        - mountPath: /downloads
          name: downloads
        - mountPath: /etc/ssl/certs
          name: host-certs
          readOnly: true
        - mountPath: /etc/pki/ca-trust/extracted
          name: host-ca-trust
          readOnly: true
        env:
        - name: 'TZ'
          value: 'Europe/Berlin'
      volumes:
      - name: media
        hostPath:
          path: /mnt/data/media
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-data
      - name: downloads
        persistentVolumeClaim:
          claimName: qbittorrent-downloads-ssd
      - name: host-certs
        hostPath:
          path: /etc/ssl/certs
          type: Directory
      - name: host-ca-trust
        hostPath:
          path: /etc/pki/ca-trust/extracted
          type: Directory
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'qbittorrent-data'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '1Gi'
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'qbittorrent-downloads-ssd'
spec:
  storageClassName: 'local-path-ssd'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '200Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: bt
spec:
  type: ClusterIP
  selector:
    app: bt
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bt
spec:
  parentRefs:
  - name: entrypoints
    namespace: gateway
    sectionName: lan-https
  hostnames:
  - 'bt.zhaohai.li'
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: bt
      port: 8080
