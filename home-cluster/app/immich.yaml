---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  labels:
    app: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
        supplementalGroups:
        - 0 # root
        - 39 # video
        - 105 # render
      volumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
      - name: dev-kfd
        hostPath:
          path: /dev/kfd
      - name: media
        hostPath:
          path: /mnt/data/media
      - name: models
        hostPath:
          path: /mnt/data/config/immich/models
      - name: ml-config
        emptyDir: {}
      - name: ml-cache
        emptyDir: {}
      containers:
      - name: immich
        image: ghcr.io/immich-app/immich-server:v3
        imagePullPolicy: Always
        volumeMounts:
        - mountPath: /dev/dri
          name: dev-dri
        - mountPath: /media
          name: media
        - mountPath: /data
          name: media
          subPath: 'immich'
        env:
        - name: HSA_OVERRIDE_GFX_VERSION
          value: '10.3.0'
        - name: TZ
          value: 'Europe/Berlin'
        - name: IMMICH_HOST
          value: '0.0.0.0'
        - name: IMMICH_PORT
          value: '2283'
        - name: UPLOAD_LOCATION
          value: '/media/immich'
        - name: DB_HOSTNAME
          value: 'postgres.infra.svc'
        - name: DB_PORT
          value: '5432'
        - name: DB_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: 'immich'
              key: 'dbname'
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: 'immich'
              key: 'dbuser'
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: 'immich'
              key: 'dbpass'
        - name: DB_STORAGE_TYPE
          value: 'HDD'
        - name: REDIS_HOSTNAME
          value: 'valkey.infra.svc'
        - name: REDIS_PORT
          value: '6379'
        - name: REDIS_DBINDEX
          value: '1'
        ports:
        - name: http
          containerPort: 2283
          protocol: TCP
      - name: immich-ml
        image: ghcr.io/immich-app/immich-machine-learning:v3 # -rocm
        imagePullPolicy: Always
        # env:
        # - name: HSA_OVERRIDE_GFX_VERSION
        #   value: '10.3.0'
        volumeMounts:
        # - mountPath: /dev/dri
        #   name: dev-dri
        # - mountPath: /dev/kfd
        #   name: dev-kfd
        - mountPath: /cache
          name: models
        - mountPath: /.config
          name: ml-config
        - mountPath: /.cache
          name: ml-cache
        env:
        - name: IMMICH_PORT
          value: '3003'
---
apiVersion: v1
kind: Service
metadata:
  name: immich
spec:
  type: ClusterIP
  selector:
    app: immich
  ports:
  - name: http
    port: 2283
    protocol: TCP
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
spec:
  rules:
  - host: 'immich.zhaohai.li'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich
            port:
              number: 2283
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-stacker
spec:
  schedule: '0 3 * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300 # 5min
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: immich-stacker
            image: mattdavis90/immich-stacker:latest
            imagePullPolicy: Always
            env:
            - name: IMMICH_ENDPOINT
              value: 'http://immich:2283/api'
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: 'immich'
                  key: 'apikey-stacker'
            - name: IMMICH_MATCH_RAW
              value: '\.[^.]*$'
            - name: IMMICH_PARENT_RAW
              value: '\.jpe?g$'
            - name: IMMICH_LOG_LEVEL
              value: 'DEBUG'
          restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-album-creator
spec:
  schedule: '0 4 * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300 # 5min
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: album-creator
            image: salvoxia/immich-folder-album-creator:latest
            imagePullPolicy: Always
            env:
            - name: API_URL
              value: 'http://immich:2283/api'
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: 'immich'
                  key: 'apikey-stacker'
            - name: ROOT_PATH
              value: '/media/photos/Googol图库'
            - name: ALBUM_LEVELS
              value: '-1'
            - name: ALBUM_SEPARATOR
              value: ' - '
            - name: UNATTENDED
              value: '1' # 无人值守直接创建
            - name: SYNC_MODE
              value: '1'
            - name: LOG_LEVEL
              value: 'DEBUG'
