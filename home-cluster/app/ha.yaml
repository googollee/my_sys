---
apiVersion: 'monitoring.coreos.com/v1'
kind: 'PodMonitor'
metadata:
  name: 'iot'
spec:
  selector:
    matchLabels:
      app: iot
  podMetricsEndpoints:
  - port: 'http'
    path: '/api/prometheus'
    interval: '30s'
    metricRelabelings:
    - sourceLabels: ['__name__']
      regex: 'hass_.*'
      action: 'keep'
    - sourceLabels: ['__name__']
      regex: 'hass_.*_created|hass_last_updated_time_seconds|hass_state_change_total|hass_entity_info|hass_area_info'
      action: 'drop'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot
  labels:
    app: iot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iot
  template:
    metadata:
      labels:
        app: iot
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [18] # dialout，访问 /dev/ttyACM0
      containers:
      - name: iot
        image: ghcr.io/home-assistant/home-assistant:latest
        imagePullPolicy: Always
        command: ['python3', '-P', '-m', 'homeassistant', '--config', '/config']
        workingDir: /config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        ports:
        - containerPort: 8123
          name: 'http'
          protocol: TCP
        startupProbe:
          httpGet:
            path: /manifest.json
            port: http
          periodSeconds: 10
          failureThreshold: 60 # 最长 10 分钟（升级后的数据库迁移）
        livenessProbe:
          httpGet:
            path: /manifest.json
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /etc/ssl/certs
          name: host-certs
          readOnly: true
        - mountPath: /etc/pki/ca-trust/extracted
          name: host-ca-trust
          readOnly: true
        env:
        - name: 'TZ'
          value: 'Europe/Berlin'
        - name: 'PYTHONMALLOC'
          value: 'mimalloc'
        - name: 'REQUESTS_CA_BUNDLE'
          value: '/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem'
        resources:
          limits:
            memory: 2Gi
            devic.es/zigbee: 1
          requests:
            memory: 512Mi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: ha-data
      - name: host-certs
        hostPath:
          path: /etc/ssl/certs
          type: Directory
      - name: host-ca-trust
        hostPath:
          path: /etc/pki/ca-trust/extracted
          type: Directory
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'ha-data'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '1Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: iot
spec:
  type: ClusterIP
  selector:
    app: iot
  ports:
  - name: http
    port: 8123
    protocol: TCP
    targetPort: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iot
spec:
  parentRefs:
  - name: entrypoints
    namespace: gateway
    sectionName: lan-https
  hostnames:
  - 'iot.zhaohai.li'
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: iot
      port: 8123
