---
apiVersion: 'monitoring.coreos.com/v1'
kind: 'PodMonitor'
metadata:
  name: 'iot'
spec:
  selector:
    matchLabels:
      app: iot
  podMetricsEndpoints:
  - port: 'http'
    path: '/api/prometheus'
    interval: '30s'
    metricRelabelings:
    - sourceLabels: ['__name__']
      regex: 'hass_.*'
      action: 'keep'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot
  labels:
    app: iot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iot
  template:
    metadata:
      labels:
        app: iot
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      terminationGracePeriodSeconds: 3600
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        supplementalGroups: [18] # dialout，访问 /dev/ttyACM0
      containers:
      - name: iot
        image: ghcr.io/home-assistant/home-assistant:latest
        imagePullPolicy: Always
        command: ['python3', '-P', '-m', 'homeassistant', '--config', '/config']
        workingDir: /config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        ports:
        - containerPort: 8123
          name: 'http'
          protocol: TCP
        volumeMounts:
        - mountPath: /config
          name: config
        env:
        - name: 'TZ'
          value: 'Europe/Berlin'
        - name: 'PYTHONMALLOC'
          value: 'mimalloc'
        resources:
          limits:
            memory: 2Gi
            devic.es/zigbee: 1
          requests:
            memory: 512Mi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: ha-data
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'ha-data'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '1Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: iot
spec:
  type: ClusterIP
  selector:
    app: iot
  ports:
  - name: http
    port: 8123
    protocol: TCP
    targetPort: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iot
spec:
  parentRefs:
  - name: entrypoints
    namespace: gateway
    sectionName: lan-https
  hostnames:
  - 'iot.zhaohai.li'
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: iot
      port: 8123
