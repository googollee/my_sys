---
apiVersion: k0s.k0sproject.io/v1beta1
kind: ClusterConfig
metadata:
  name: k0s
spec:
  api:
    sans:
    - nas
    - nas.local
    - nas.zhaohai.li
  controllerManager:
    extraArgs:
      terminated-pod-gc-threshold: "1"
  workerProfiles:
  - name: default
    values:
      imageMaximumGCAge: 168h
      seccompDefault: true
