---
# butane --pretty --strict -d . coreos.yaml > coreos.ign
variant: fcos
version: 1.6.0
passwd:
  users:
  - name: core
    should_exist: false
  - name: googol
    system: false
    ssh_authorized_keys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILRbXerF24s/H59FsEaPYfHZ1113Eij81+1ED7VGPK+p googol@mbp-laptop
    groups:
    - docker
    - wheel
    - sudo
    - systemd-journal
systemd:
  units:
  - name: cpu-governor.service
    enabled: true
    contents_local: coreos.files/cpu-governor.service
  - name: var-mnt-data.mount
    enabled: false
    contents_local: coreos.files/var-mnt-data.mount
  - name: btrfs-scrub.service
    contents_local: coreos.files/btrfs-scrub.service
  - name: btrfs-scrub.timer
    enabled: true
    contents_local: coreos.files/btrfs-scrub.timer
  - name: iot-guard.service
    enabled: true
    contents_local: coreos.files/iot-guard.service
  - name: xfs-quota.service
    contents_local: coreos.files/xfs-quota.service
  - name: xfs-quota.path
    enabled: true
    contents_local: coreos.files/xfs-quota.path
  - name: var-lib-volumes.mount
    enabled: true
    contents_local: coreos.files/var-lib-volumes.mount
storage:
  directories:
  - path: /var/lib/volumes
    mode: 0755
  files:
  - path: /etc/hostname
    mode: 0644
    contents:
      inline: nas
  - path: /etc/zincati/config.d/55-updates-strategy.toml
    mode: 0644
    contents:
      local: coreos.files/updates-strategy.toml
  - path: /etc/systemd/system/k0scontroller.service.d/10-data.conf
    mode: 0644
    contents:
      local: coreos.files/k0s-data.conf
  - path: /etc/modules-load.d/it87.conf
    mode: 0644
    contents:
      inline: it87
  - path: /etc/modprobe.d/it87.conf
    mode: 0644
    contents:
      inline: options it87 force_id=0x8622 ignore_resource_conflict=1
  - path: /etc/NetworkManager/system-connections/enp2s0.3.nmconnection
    mode: 0600
    contents:
      local: coreos.files/enp2s0.3.nmconnection
  - path: /etc/nftables/iot-guard.nft
    mode: 0644
    contents:
      local: coreos.files/iot-guard.nft
  - path: /etc/udev/rules.d/99-zigbee.rules
    mode: 0644
    contents:
      local: coreos.files/99-zigbee.rules
  - path: /etc/udev/rules.d/99-usb-disk-shutdown.rules
    mode: 0644
    contents:
      local: coreos.files/99-usb-disk-shutdown.rules
  - path: /etc/projects
    mode: 0644
    contents:
      local: coreos.files/projects
  - path: /etc/projid
    mode: 0644
    contents:
      local: coreos.files/projid
  - path: /etc/k0s/config.yaml
    mode: 0644
    contents:
      local: coreos.files/k0s.yaml
  - path: /home/googol/install_k0s.sh
    mode: 0755
    contents:
      local: coreos.files/install_k0s.sh
  links:
  - path: /etc/localtime
    target: ../usr/share/zoneinfo/Europe/Berlin
kernel_arguments:
  should_exist:
  - rootflags=prjquota
