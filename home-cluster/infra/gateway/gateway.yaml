---
apiVersion: 'gateway.networking.k8s.io/v1'
kind: 'Gateway'
metadata:
  name: 'entrypoints'
  namespace: 'gateway'
spec:
  gatewayClassName: 'traefik'
  listeners:
  - name: 'lan-https'
    protocol: 'HTTPS'
    port: 7443 # -> hostPort 443
    tls:
      mode: 'Terminate'
      certificateRefs: [{name: 'lan-tls-secret'}]
    allowedRoutes:
      namespaces: {from: 'All'}
---
apiVersion: 'cert-manager.io/v1'
kind: 'Certificate'
metadata:
  name: 'lan-gateway-cert'
  namespace: 'gateway'
spec:
  secretName: 'lan-tls-secret'
  issuerRef:
    name: 'cloudflare'
    kind: 'ClusterIssuer'
  dnsNames:
  - '*.zhaohai.li'
  - 'zhaohai.li'
