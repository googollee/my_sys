---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: gateway
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: infra
  interval: 30m
  targetNamespace: gateway
  releaseName: traefik
  install:
    createNamespace: true
    crds: 'CreateReplace'
  upgrade:
    crds: 'CreateReplace'

  # hostIP 不能写在 values 的 ports 里：chart 会把它拼进 entryPoint 的监听地址，
  # Pod 网络里没有这个 IP，traefik 会绑定失败。只给容器端口补 hostIP。
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: traefik
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: traefik
          spec:
            template:
              spec:
                containers:
                - name: traefik
                  ports:
                  - containerPort: 7080
                    protocol: TCP
                    hostIP: 192.168.10.2
                  - containerPort: 7443
                    protocol: TCP
                    hostIP: 192.168.10.2
                  - containerPort: 8443
                    protocol: TCP
                    hostIP: 192.168.10.2

  values:
    hostNetwork: false
    deployment:
      enabled: true
      kind: Deployment
      replicas: 1
    service:
      enabled: true
      single: true
      spec:
        type: ClusterIP
    updateStrategy:
      type: Recreate
    autoscaling:
      enabled: false
    rbac:
      enabled: false
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    podSecurityContext:
      fsGroup: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534

    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json
    metrics:
      prometheus:
        entryPoint: metrics

    providers:
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: true
        namespaces: ['gateway', 'app', 'default']
        allowExternalNameServices: true
      kubernetesGateway:
        enabled: true
        namespaces: ['gateway', 'app', 'default']
      file:
        enabled: false

    ingressClass:
      enabled: false
    gatewayClass:
      enabled: false
    gateway:
      enabled: false

    ports:
      traefik:
        port: 18888
        expose:
          default: false
        exposedPort: 18888
        protocol: TCP
      metrics:
        port: 18889
        expose:
          default: false
        exposedPort: 18889
        protocol: TCP
      web:
        port: 7080
        hostPort: 80
        expose:
          default: true
        exposedPort: 80
      websecure:
        asDefault: true
        port: 7443
        hostPort: 443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
        http:
          tls:
            enabled: true
      wansecure:
        port: 8443
        hostPort: 8443
        expose:
          default: true
        exposedPort: 8443
        protocol: TCP
        http:
          tls:
            enabled: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
  namespace: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: 'traefik'
  policyTypes: ['Ingress', 'Egress']
  ingress:
  # 客户端，任意来源。hostPort 80/443/8443 经 DNAT 后是容器端口
  - ports:
    - {protocol: 'TCP', port: 7080}
    - {protocol: 'TCP', port: 7443}
    - {protocol: 'TCP', port: 8443}
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'infra'}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: 'alloy'
    ports:
    - {protocol: 'TCP', port: 18889}
  # kubelet 探针
  - from:
    - ipBlock: {cidr: '10.244.0.1/32'}
    - ipBlock: {cidr: '192.168.10.2/32'}
    ports:
    - {protocol: 'TCP', port: 18888}
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'kube-system'}
      podSelector:
        matchLabels: {k8s-app: 'kube-dns'}
    ports:
    - {protocol: 'UDP', port: 53}
    - {protocol: 'TCP', port: 53}
  # API server，DNAT 之后的地址
  - to:
    - ipBlock: {cidr: '192.168.10.2/32'}
    ports:
    - {protocol: 'TCP', port: 6443}
  # traefik 自身（wan-routing）和后端
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'gateway'}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'app'}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'infra'}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'default'}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'grafana'}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'versitygw'}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
- apiGroups: ['']
  resources: ['namespaces', 'nodes']
  verbs: ['get', 'list', 'watch']
- apiGroups: ['gateway.networking.k8s.io']
  resources: ['gatewayclasses']
  verbs: ['get', 'list', 'watch']
- apiGroups: ['gateway.networking.k8s.io']
  resources: ['gatewayclasses/status']
  verbs: ['update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
- kind: ServiceAccount
  name: traefik
  namespace: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-namespaced
rules:
- apiGroups: ['']
  resources: ['configmaps', 'services', 'secrets']
  verbs: ['get', 'list', 'watch']
- apiGroups: ['']
  resources: ['pods']
  verbs: ['get']
- apiGroups: ['discovery.k8s.io']
  resources: ['endpointslices']
  verbs: ['list', 'watch']
- apiGroups: ['traefik.io']
  resources: ['ingressroutes', 'ingressroutetcps', 'ingressrouteudps', 'middlewares', 'middlewaretcps', 'serverstransports', 'serverstransporttcps', 'tlsoptions', 'tlsstores', 'traefikservices']
  verbs: ['get', 'list', 'watch']
- apiGroups: ['gateway.networking.k8s.io']
  resources: ['backendtlspolicies', 'gateways', 'grpcroutes', 'httproutes', 'referencegrants', 'tcproutes', 'tlsroutes']
  verbs: ['get', 'list', 'watch']
- apiGroups: ['gateway.networking.k8s.io']
  resources: ['backendtlspolicies/status', 'gateways/status', 'grpcroutes/status', 'httproutes/status', 'tcproutes/status', 'tlsroutes/status']
  verbs: ['update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik
  namespace: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-namespaced
subjects:
- kind: ServiceAccount
  name: traefik
  namespace: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik
  namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-namespaced
subjects:
- kind: ServiceAccount
  name: traefik
  namespace: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-namespaced
subjects:
- kind: ServiceAccount
  name: traefik
  namespace: gateway
