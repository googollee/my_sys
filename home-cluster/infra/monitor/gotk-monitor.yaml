---
apiVersion: 'monitoring.coreos.com/v1'
kind: 'PodMonitor'
metadata:
  name: 'gotk'
  namespace: 'infra'
spec:
  namespaceSelector:
    matchNames:
    - 'flux-system'
  selector:
    matchExpressions:
    - key: 'app'
      operator: 'Exists'
  podMetricsEndpoints:
  - port: 'http-prom'
    path: '/metrics'
    interval: '30s'
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: 'controller_runtime_reconcile_(total|errors_total|time_seconds_(sum|count))'
      action: 'keep'

