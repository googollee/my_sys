---
apiVersion: 'helm.toolkit.fluxcd.io/v2'
kind: 'HelmRelease'
metadata:
  name: 'kube-state-metrics'
  namespace: 'infra'
spec:
  chart:
    spec:
      chart: 'kube-state-metrics'
      sourceRef:
        kind: 'HelmRepository'
        name: 'prometheus-community'
        namespace: 'infra'
  interval: '30m'
  targetNamespace: 'infra'
  releaseName: 'kube-state-metrics'
  values:
    collectors:
    - 'cronjobs'
    - 'daemonsets'
    - 'deployments'
    - 'jobs'
    - 'persistentvolumeclaims'
    - 'pods'
    - 'statefulsets'
    rbac:
      extraRules:
      - apiGroups:
        - 'source.toolkit.fluxcd.io'
        - 'kustomize.toolkit.fluxcd.io'
        - 'helm.toolkit.fluxcd.io'
        resources:
        - 'gitrepositories'
        - 'helmrepositories'
        - 'helmcharts'
        - 'kustomizations'
        - 'helmreleases'
        verbs: ['list', 'watch']
    customResourceState:
      enabled: true
      config:
        spec:
          resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
                - name: 'resource_info'
                  help: 'The current state of a Flux Kustomization resource.'
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [ metadata, name ]
                  labelsFromPath:
                    exported_namespace: [ metadata, namespace ]
                    ready: [ status, conditions, '[type=Ready]', status ]
                    suspended: [ spec, suspend ]
                    revision: [ status, lastAppliedRevision ]
                    source_name: [ spec, sourceRef, name ]
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics:
                - name: 'resource_info'
                  help: 'The current state of a Flux HelmRelease resource.'
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [ metadata, name ]
                  labelsFromPath:
                    exported_namespace: [ metadata, namespace ]
                    ready: [ status, conditions, '[type=Ready]', status ]
                    suspended: [ spec, suspend ]
                    revision: [ status, history, '0', chartVersion ]
                    chart_name: [ status, history, '0', chartName ]
                    chart_app_version: [ status, history, '0', appVersion ]
                    chart_ref_name: [ spec, chartRef, name ]
                    chart_source_name: [ spec, chart, spec, sourceRef, name ]
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics:
                - name: 'resource_info'
                  help: 'The current state of a Flux GitRepository resource.'
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [ metadata, name ]
                  labelsFromPath:
                    exported_namespace: [ metadata, namespace ]
                    ready: [ status, conditions, '[type=Ready]', status ]
                    suspended: [ spec, suspend ]
                    revision: [ status, artifact, revision ]
                    url: [ spec, url ]
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmRepository
              metricNamePrefix: gotk
              metrics:
                - name: 'resource_info'
                  help: 'The current state of a Flux HelmRepository resource.'
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [ metadata, name ]
                  labelsFromPath:
                    exported_namespace: [ metadata, namespace ]
                    ready: [ status, conditions, '[type=Ready]', status ]
                    suspended: [ spec, suspend ]
                    revision: [ status, artifact, revision ]
                    url: [ spec, url ]
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmChart
              metricNamePrefix: gotk
              metrics:
                - name: 'resource_info'
                  help: 'The current state of a Flux HelmChart resource.'
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [ metadata, name ]
                  labelsFromPath:
                    exported_namespace: [ metadata, namespace ]
                    ready: [ status, conditions, '[type=Ready]', status ]
                    suspended: [ spec, suspend ]
                    revision: [ status, artifact, revision ]
                    chart_name: [ spec, chart ]
                    chart_version: [ spec, version ]
---
apiVersion: 'monitoring.coreos.com/v1'
kind: 'PodMonitor'
metadata:
  name: 'kube-state-metrics'
  namespace: 'infra'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: 'kube-state-metrics'
  podMetricsEndpoints:
  - port: 'http'
    path: '/metrics'
    interval: '30s'
