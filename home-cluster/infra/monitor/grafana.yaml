---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: infra
spec:
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: infra
  interval: 30m
  install:
    createNamespace: true
  targetNamespace: infra
  releaseName: grafana
  values:
    replicas: 1
    admin:
      existingSecret: service-admin
    smtp:
      existingSecret: gmail-smtp
    securityContext:
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
    extraVolumeMounts:
    - name: 'local-storage'
      mountPath: '/var/lib/grafana.local'
      readOnly: false
    extraVolumes:
    - name: 'local-storage'
      existingClaim: 'grafana-data'

    grafana.ini:
      log:
        mode: 'console'
      server:
        domain: 'monitor.zhaohai.li'
        root_url: 'https://monitor.zhaohai.li'
      paths:
        data: '/var/lib/grafana.local/'
        logs: '/var/lib/grafana.local/'
        plugins: '/var/lib/grafana.local/plugins'
        provisioning: '/etc/grafana/provisioning'
      date_formats:
        default_timezone: Europe/Berlin
      smtp:
        enabled: true
        from_name: Alert
        from_address: me+nas_alert@zhaohai.li
        host: smtp.gmail.com:587

    persistence:
      enabled: false
      inMemory:
        enabled: false

    ingress:
      enabled: false
    initChownData:
      enabled: false
    serviceAccount:
      create: false
    rbac:
      create: false
    testFramework:
      enabled: false
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'grafana-data'
  namespace: 'infra'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '1Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-proxy
  namespace: app
spec:
  type: ExternalName
  externalName: 'grafana.infra.svc.cluster.local'
  ports:
  - name: http
    port: 80
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-proxy
  namespace: app
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`monitor.zhaohai.li`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: grafana-proxy
      kind: Service
      port: 80
