---
apiVersion: autopilot.k0sproject.io/v1beta2
kind: UpdateConfig
metadata:
  name: update-k0s
  namespace: default
spec:
  channel: stable
  # k0sproject/update 的 stable 已停更，改用持续维护的 fork
  updateServer: https://raw.githubusercontent.com/flokoe/update/main/
  upgradeStrategy:
    type: periodic
    periodic:
      days: [Saturday]
      startTime: '1:00'
      length: 1h
