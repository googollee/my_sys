---
apiVersion: autopilot.k0sproject.io/v1beta2
kind: UpdateConfig
metadata:
  name: update-k0s
  namespace: default
spec:
  channel: stable
  # k0sproject/update 的 stable 已停更，由 k0s-update-channel workflow 生成
  updateServer: https://raw.githubusercontent.com/googollee/my_sys/main/home-cluster/k0s-update/
  upgradeStrategy:
    type: periodic
    periodic:
      days: [Saturday]
      startTime: '1:00'
      length: 30m
  # 不写 planSpec 时 autopilot 加 finalizer 会因 commands 缺失被 CRD 拒绝
  planSpec:
    commands:
    - k0supdate:
        targets:
          controllers:
            discovery:
              selector: {}
