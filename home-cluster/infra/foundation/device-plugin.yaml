---
apiVersion: 'apps/v1'
kind: 'DaemonSet'
metadata:
  name: 'generic-device-plugin'
  namespace: 'kube-system'
  labels:
    app.kubernetes.io/name: 'generic-device-plugin'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: 'generic-device-plugin'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 'generic-device-plugin'
    spec:
      priorityClassName: 'system-node-critical'
      tolerations:
      - operator: 'Exists'
        effect: 'NoExecute'
      - operator: 'Exists'
        effect: 'NoSchedule'
      containers:
      - image: 'ghcr.io/squat/generic-device-plugin:latest'
        imagePullPolicy: 'Always'
        args:
        - '--device'
        - |
          name: dri
          groups:
            - count: 4
              paths:
                - path: /dev/dri/renderD128
        - '--device'
        - |
          name: zigbee
          groups:
            - count: 1
              paths:
                - path: /dev/ttyACM0
        - '--device'
        - |
          name: kvm
          groups:
            - count: 4
              paths:
                - path: /dev/kvm
        - '--device'
        - |
          name: tun
          groups:
            - count: 4
              paths:
                - path: /dev/net/tun
        name: 'generic-device-plugin'
        resources:
          requests:
            cpu: '0'
            memory: '10Mi'
          limits:
            cpu: '50m'
            memory: '20Mi'
        ports:
        - containerPort: 8080
          name: 'http'
        securityContext:
          privileged: true
        volumeMounts:
        - name: 'device-plugin'
          mountPath: '/var/lib/kubelet/device-plugins'
        - name: 'dev'
          mountPath: '/dev'
      volumes:
      - name: 'device-plugin'
        hostPath:
          path: '/var/lib/kubelet/device-plugins'
      - name: 'dev'
        hostPath:
          path: '/dev'
  updateStrategy:
    type: 'RollingUpdate'
