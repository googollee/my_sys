---
apiVersion: 'v1'
kind: 'ServiceAccount'
metadata:
  name: 'failed-pod-cleaner'
  namespace: 'kube-system'
---
apiVersion: 'rbac.authorization.k8s.io/v1'
kind: 'ClusterRole'
metadata:
  name: 'failed-pod-cleaner'
rules:
- apiGroups: ['']
  resources: ['pods']
  verbs: ['list', 'delete']
---
apiVersion: 'rbac.authorization.k8s.io/v1'
kind: 'ClusterRoleBinding'
metadata:
  name: 'failed-pod-cleaner'
subjects:
- kind: 'ServiceAccount'
  name: 'failed-pod-cleaner'
  namespace: 'kube-system'
roleRef:
  apiGroup: 'rbac.authorization.k8s.io'
  kind: 'ClusterRole'
  name: 'failed-pod-cleaner'
---
apiVersion: 'batch/v1'
kind: 'CronJob'
metadata:
  name: 'failed-pod-cleaner'
  namespace: 'kube-system'
spec:
  schedule: '17 * * * *'
  concurrencyPolicy: 'Forbid'
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: 'failed-pod-cleaner'
          hostUsers: false
          restartPolicy: 'Never'
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
          containers:
          - name: 'cleaner'
            image: 'alpine/kubectl:latest'
            imagePullPolicy: 'Always'
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ['ALL']
            env:
            - name: 'HOME'
              value: '/tmp'
            resources:
              requests:
                cpu: '0'
                memory: '32Mi'
              limits:
                memory: '128Mi'
            command:
            - 'sh'
            - '-c'
            - |
              set -eu
              tab=$(printf '\t')
              kubectl get pods -A --field-selector=status.phase=Running \
                -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.ownerReferences[0].uid}{"\t"}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' \
                > /tmp/running
              kubectl get pods -A --field-selector=status.phase=Failed \
                -o jsonpath='{range .items[?(@.status.reason=="UnexpectedAdmissionError")]}{.metadata.namespace}{"\t"}{.metadata.ownerReferences[0].uid}{"\t"}{.metadata.creationTimestamp}{"\t"}{.metadata.name}{"\n"}{end}' \
                | sort -t "$tab" -k3,3r > /tmp/failed
              awk -F "$tab" '
                FILENAME == ARGV[1] { if ($2 != "" && $3 == "True") ready[$1 FS $2] = 1; next }
                { key = $1 FS $2; if ((key in ready) || ++n[key] > 3) print $1 FS $4 }
              ' /tmp/running /tmp/failed > /tmp/delete
              echo "failed pods: $(wc -l < /tmp/failed), to delete: $(wc -l < /tmp/delete)"
              while IFS="$tab" read -r ns name; do
                kubectl delete pod -n "$ns" "$name" --wait=false
              done < /tmp/delete
            volumeMounts:
            - name: 'tmp'
              mountPath: '/tmp'
          volumes:
          - name: 'tmp'
            emptyDir: {}
