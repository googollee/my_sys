---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: samba
  namespace: samba
spec:
  selector:
    matchLabels:
      app: samba
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: samba
    spec:
      hostUsers: false
      nodeSelector:
        kubernetes.io/hostname: nas

      volumes:
      - name: config
        configMap:
          name: samba-config
      - name: host-storage
        hostPath:
          path: /mnt/data/media
      - name: samba-log
        emptyDir: {}
      containers:
      - name: samba
        image: alpine:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
            add: ['CHOWN', 'NET_BIND_SERVICE', 'SETGID', 'SETUID']
        env:
        - name: SMB_USER
          valueFrom:
            secretKeyRef: {name: smb-auth, key: SMB_USER}
        - name: SMB_UID
          valueFrom:
            secretKeyRef: {name: smb-auth, key: SMB_UID}
        - name: SMB_GROUP
          valueFrom:
            secretKeyRef: {name: smb-auth, key: SMB_GROUP}
        - name: SMB_GID
          valueFrom:
            secretKeyRef: {name: smb-auth, key: SMB_GID}
        - name: SMB_PASS
          valueFrom:
            secretKeyRef: {name: smb-auth, key: SMB_PASS}
        command: ['/bin/sh', '-c']
        args:
        - |
          apk add --no-cache samba shadow su-exec

          groupadd -g ${SMB_GID} ${SMB_GROUP}
          useradd -u ${SMB_UID} -g ${SMB_GROUP} -s /sbin/nologin -M ${SMB_USER}

          rm -rf /etc/samba/*
          sed "s/__SMB_GROUP__/${SMB_GROUP}/g" /run/samba/smb.conf.template > /etc/samba/smb.conf
          echo -e "${SMB_PASS}\n${SMB_PASS}" | smbpasswd -a -s ${SMB_USER}

          exec /usr/sbin/smbd -F --no-process-group </dev/null
        volumeMounts:
        - name: config
          mountPath: /run/samba/smb.conf.template
          subPath: smb.conf.template
        - name: host-storage
          mountPath: /mnt/data/media
        - name: samba-log
          mountPath: /var/log/samba
        ports:
        - containerPort: 445
          hostPort: 445
          hostIP: 192.168.10.2
          protocol: TCP
          name: smb-tcp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: samba-config
  namespace: samba
data:
  smb.conf.template: |
    [global]
      min protocol = SMB2
      workgroup = WORKGROUP
      server string = nas samba server
      server role = standalone server
      logging = stdout
      log level = 1
      max log size = 0
      guest account = nobody

      server smb transports = tcp
      hosts allow = 192.168.10.0/24

      aio read size = 16384
      aio write size = 16384
      use sendfile = yes

      vfs objects = catia fruit streams_xattr
      fruit:aapl = yes
      fruit:metadata = stream
      fruit:model = Macmini
      fruit:posix_metadata = yes

    [media]
      comment = My Media
      path = /mnt/data/media
      writeable = yes
      browseable = yes
      guest ok = no
      public = no
      create mask = 0644
      directory mask = 0755
      valid users = @__SMB_GROUP__
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: samba
  namespace: samba
spec:
  podSelector:
    matchLabels:
      app: samba
  policyTypes: ['Ingress', 'Egress']
  ingress:
  - from:
    - ipBlock: {cidr: '192.168.10.0/24'}
    ports:
    - {protocol: 'TCP', port: 445}
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'kube-system'}
      podSelector:
        matchLabels: {k8s-app: 'kube-dns'}
    ports:
    - {protocol: 'UDP', port: 53}
    - {protocol: 'TCP', port: 53}
  # 启动时 apk add
  - ports:
    - {protocol: 'TCP', port: 443}
