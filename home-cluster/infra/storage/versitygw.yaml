---
apiVersion: v1
kind: Service
metadata:
  name: versitygw
  namespace: versitygw
spec:
  type: ClusterIP
  ports:
  - port: 7070
    targetPort: http
    protocol: TCP
    name: http
  - port: 7071
    targetPort: ui
    protocol: TCP
    name: ui
  selector:
    app.kubernetes.io/name: versitygw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versitygw
  namespace: versitygw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versitygw
  template:
    metadata:
      namespace: versitygw
      labels:
        app.kubernetes.io/name: versitygw
    spec:
      hostUsers: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: versitygw
        env:
        - name: 'ROOT_ACCESS_KEY'
          valueFrom:
            secretKeyRef:
              name: 's3-keys'
              key: 'access-key'
        - name: 'ROOT_SECRET_KEY'
          valueFrom:
            secretKeyRef:
              name: 's3-keys'
              key: 'secret-key'
        - name: 'VGW_REGION'
          value: 'us-east-1'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        image: 'versity/versitygw:latest'
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 7070
          protocol: TCP
        - name: ui
          containerPort: 7071
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: http
        readinessProbe:
          tcpSocket:
            port: http
        resources: {}
        args:
        - '--port'
        - ':7070'
        - '--webui'
        - ':7071'
        - '--webui-no-tls'
        - '--webui-gateways'
        - 'https://s3.zhaohai.li'
        - '--cors-allow-origin'
        - 'https://versitygw-p.zhaohai.li'
        - 'posix'
        - '/data/s3'
        volumeMounts:
        - mountPath: /data/s3
          name: file-storage
      volumes:
      - name: file-storage
        persistentVolumeClaim:
          claimName: versitygw-data
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'versitygw-data'
  namespace: 'versitygw'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '10Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: versitygw-proxy
  namespace: app
spec:
  type: ExternalName
  externalName: 'versitygw.versitygw.svc.cluster.local'
  ports:
  - name: http
    port: 7070
    protocol: TCP
  - name: ui
    port: 7071
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: versitygw-proxy
  namespace: app
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`s3.zhaohai.li`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: versitygw-proxy
      kind: Service
      port: 7070
  - match: Host(`versitygw-p.zhaohai.li`) && PathPrefix(`/`)
    kind: Rule
    services:
    - name: versitygw-proxy
      kind: Service
      port: 7071
---
apiVersion: 'networking.k8s.io/v1'
kind: 'NetworkPolicy'
metadata:
  name: 'versitygw'
  namespace: 'versitygw'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: 'versitygw'
  policyTypes: ['Ingress']
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'app'}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'default'}
    ports:
    - {protocol: 'TCP', port: 7070}
  # traefik：s3.zhaohai.li、versitygw-p.zhaohai.li
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'gateway'}
    ports:
    - {protocol: 'TCP', port: 7070}
    - {protocol: 'TCP', port: 7071}
