---
apiVersion: v1
kind: Service
metadata:
  name: versitygw
  namespace: infra
spec:
  type: ClusterIP
  ports:
  - port: 7070
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: versitygw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versitygw
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versitygw
  template:
    metadata:
      namespace: infra
      labels:
        app.kubernetes.io/name: versitygw
    spec:
      securityContext: {}
      containers:
      - name: versitygw
        env:
        - name: 'ROOT_ACCESS_KEY'
          valueFrom:
            secretKeyRef:
              name: 's3-keys'
              key: 'access-key'
        - name: 'ROOT_SECRET_KEY'
          valueFrom:
            secretKeyRef:
              name: 's3-keys'
              key: 'secret-key'
        - name: 'VGW_REGION'
          value: 'us-east-1'
        securityContext: {}
        image: 'versity/versitygw:latest'
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 7070
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: http
        readinessProbe:
          tcpSocket:
            port: http
        resources: {}
        args:
        - '--port'
        - ':7070'
        - 'posix'
        - '/data/s3'
        volumeMounts:
        - mountPath: /data/s3
          name: file-storage
      volumes:
      - name: file-storage
        persistentVolumeClaim:
          claimName: versitygw-data
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'versitygw-data'
  namespace: 'infra'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '10Gi'
