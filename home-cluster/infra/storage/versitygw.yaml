apiVersion: v1
kind: Service
metadata:
  name: versitygw
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - port: 7070
      targetPort: http
      protocol: TCP
      name: http
    - port: 7071
      targetPort: ui
      protocol: TCP
      name: ui
  selector:
    app.kubernetes.io/name: versitygw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versitygw
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versitygw
  template:
    metadata:
      namespace: infra
      labels:
        app.kubernetes.io/name: versitygw
    spec:
      securityContext:
        {}
      containers:
        - name: versitygw
          env:
          - name: "ROOT_ACCESS_KEY"
            valueFrom:
              secretKeyRef:
                name: "s3-keys"
                key: "access-key"
          - name: "ROOT_SECRET_KEY"
            valueFrom:
              secretKeyRef:
                name: "s3-keys"
                key: "secret-key"
          - name: "VGW_REGION"
            value: "us-east-1"
          securityContext:
            {}
          image: "versity/versitygw:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7070
              protocol: TCP
            - name: ui
              containerPort: 7071 
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: ui
          readinessProbe:
            httpGet:
              path: /
              port: ui
          resources:
            {}
          args:
          - "--cors-allow-origin"
          - "https://s3-ui.zhaohai.li"
          - "--port"
          - ":7070"
          - "--webui"
          - ":7071"
          - "--webui-no-tls"
          - "posix"
          - "/data/s3"
          volumeMounts:
            - mountPath: /data/s3
              name: file-storage
              subPath: s3
      volumes:
        - name: file-storage
          persistentVolumeClaim:
            claimName: local-pvc
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-header
  namespace: infra
spec:
  headers:
    accessControlAllowMethods:
      - "GET"
      - "OPTIONS"
      - "PUT"
      - "HEAD"
      - "DELETE"
      - "POST"
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - "https://s3-ui.zhaohai.li"
    accessControlMaxAge: 100
    addVaryHeader: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: versitygw-s3
  namespace: infra
spec:
  parentRefs:
  - name: entrypoints
    namespace: infra
    sectionName: lan-https
  hostnames:
  - "s3.zhaohai.li"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: cors-header
    backendRefs:
    - name: versitygw
      port: 7070
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: versitygw-s3-ui
  namespace: infra
spec:
  parentRefs:
  - name: entrypoints
    namespace: infra
    sectionName: lan-https
  hostnames:
  - "s3-ui.zhaohai.li"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: cors-header
    backendRefs:
    - name: versitygw
      port: 7071
