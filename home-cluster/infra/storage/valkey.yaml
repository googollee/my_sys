---
apiVersion: 'source.toolkit.fluxcd.io/v1'
kind: 'HelmRepository'
metadata:
  name: 'valkey'
  namespace: 'infra'
spec:
  interval: '30m'
  url: 'https://valkey.io/valkey-helm/'
---
apiVersion: 'helm.toolkit.fluxcd.io/v2'
kind: 'HelmRelease'
metadata:
  name: 'valkey'
  namespace: 'infra'
spec:
  chart:
    spec:
      chart: 'valkey'
      sourceRef:
        kind: 'HelmRepository'
        name: 'valkey'
        namespace: 'infra'
  interval: '30m'
  install:
    createNamespace: true
  targetNamespace: 'infra'
  releaseName: 'valkey'
  values:
    replicaCount: 1
    deploymentStrategy: 'Recreate'
    podSecurityContext:
      fsGroup: 65534
      fsGroupChangePolicy: 'OnRootMismatch'
      runAsUser: 65534
      runAsGroup: 65534
    securityContext:
      runAsUser: 65534
    serviceAccount:
      create: false
    dataStorage:
      enabled: true
      persistentVolumeClaimName: 'valkey-data'
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'valkey-data'
  namespace: 'infra'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '1Gi'
---
apiVersion: 'networking.k8s.io/v1'
kind: 'NetworkPolicy'
metadata:
  name: 'valkey'
  namespace: 'infra'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: 'valkey'
  policyTypes: ['Ingress']
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'app'}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'default'}
    ports:
    - {protocol: 'TCP', port: 6379}
