---
apiVersion: 'v1'
kind: 'ConfigMap'
metadata:
  name: 'postgres-hba'
  namespace: 'postgres'
data:
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    host    all             postgres        127.0.0.1/32            md5
    host    all             postgres        0.0.0.0/0               reject
    host    all             all             0.0.0.0/0               md5
---
apiVersion: 'v1'
kind: 'Service'
metadata:
  name: 'postgres'
  namespace: 'postgres'
spec:
  clusterIP: 'None'
  selector:
    app.kubernetes.io/name: 'postgresql'
  ports:
  - name: 'postgresql'
    port: 5432
    targetPort: 'postgresql'
---
apiVersion: 'apps/v1'
kind: 'StatefulSet'
metadata:
  name: 'postgres'
  namespace: 'postgres'
spec:
  serviceName: 'postgres'
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: 'postgresql'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 'postgresql'
    spec:
      automountServiceAccountToken: false
      hostUsers: false
      # 不设 fsGroup：PostgreSQL 要求数据目录权限为 0700/0750，fsGroup 会加上组写权限
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
      initContainers:
      - name: 'install-extensions'
        image: 'postgres:18'
        imagePullPolicy: 'Always'
        securityContext:
          runAsUser: 0
        env:
        - name: 'VCHORD_VERSION'
          value: '1.1.1'
        command:
        - 'sh'
        - '-c'
        - |
          set -eu
          cp -a /usr/lib/postgresql/18/lib/. /mnt/pglib/
          cp -a /usr/share/postgresql/18/extension/. /mnt/pgext/
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates postgresql-18-pgvector
          curl -fsSL -o /tmp/vchord.deb \
            "https://github.com/supervc-stack/VectorChord/releases/download/${VCHORD_VERSION}/postgresql-18-vchord_${VCHORD_VERSION}-1_amd64.deb"
          apt-get install -y --no-install-recommends /tmp/vchord.deb
          vchord_pkg=$(dpkg-deb -f /tmp/vchord.deb Package)
          dpkg -L postgresql-18-pgvector "$vchord_pkg" > /tmp/ext-files
          while read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              /usr/lib/postgresql/18/lib/*) dst=/mnt/pglib/${f#/usr/lib/postgresql/18/lib/} ;;
              /usr/share/postgresql/18/extension/*) dst=/mnt/pgext/${f#/usr/share/postgresql/18/extension/} ;;
              *) continue ;;
            esac
            mkdir -p "$(dirname "$dst")"
            cp -a "$f" "$dst"
          done < /tmp/ext-files
          test -f /mnt/pglib/vector.so
          test -f /mnt/pglib/vchord.so
        volumeMounts:
        - name: 'pg-lib'
          mountPath: '/mnt/pglib'
        - name: 'pg-share-extension'
          mountPath: '/mnt/pgext'
      containers:
      - name: 'postgres'
        image: 'postgres:18'
        imagePullPolicy: 'Always'
        args:
        - '-c'
        - 'hba_file=/etc/postgresql-custom/pg_hba.conf'
        - '-c'
        - 'shared_preload_libraries=vchord'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - 'ALL'
        env:
        - name: 'POSTGRES_PASSWORD'
          valueFrom:
            secretKeyRef:
              name: 'db-admin'
              key: 'password'
        ports:
        - name: 'postgresql'
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - 'pg_isready'
            - '-U'
            - 'postgres'
            - '-h'
            - '127.0.0.1'
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - 'pg_isready'
            - '-U'
            - 'postgres'
            - '-h'
            - '127.0.0.1'
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: 'data'
          mountPath: '/var/lib/postgresql'
        - name: 'pg-hba'
          mountPath: '/etc/postgresql-custom'
          readOnly: true
        - name: 'pg-lib'
          mountPath: '/usr/lib/postgresql/18/lib'
          readOnly: true
        - name: 'pg-share-extension'
          mountPath: '/usr/share/postgresql/18/extension'
          readOnly: true
      volumes:
      - name: 'data'
        persistentVolumeClaim:
          claimName: 'postgres-data-18'
      - name: 'pg-hba'
        configMap:
          name: 'postgres-hba'
      - name: 'pg-lib'
        emptyDir: {}
      - name: 'pg-share-extension'
        emptyDir: {}
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'postgres-data'
  namespace: 'postgres'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '20Gi'
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'postgres-data-18'
  namespace: 'postgres'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '20Gi'
---
apiVersion: 'networking.k8s.io/v1'
kind: 'NetworkPolicy'
metadata:
  name: 'postgres'
  namespace: 'postgres'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: 'postgresql'
  policyTypes: ['Ingress']
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'app'}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: 'default'}
    ports:
    - {protocol: 'TCP', port: 5432}
