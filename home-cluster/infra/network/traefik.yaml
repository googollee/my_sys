---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: infra
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: infra
  interval: 30m
  targetNamespace: infra
  releaseName: traefik
  install:
    createNamespace: true
    crds: 'CreateReplace'
  upgrade:
    crds: 'CreateReplace'

  # hostIP 不能写在 values 的 ports 里：chart 会把它拼进 entryPoint 的监听地址，
  # Pod 网络里没有这个 IP，traefik 会绑定失败。只给容器端口补 hostIP。
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: traefik
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: traefik
          spec:
            template:
              spec:
                containers:
                - name: traefik
                  ports:
                  - containerPort: 7080
                    protocol: TCP
                    hostIP: 192.168.10.2
                  - containerPort: 7443
                    protocol: TCP
                    hostIP: 192.168.10.2
                  - containerPort: 8443
                    protocol: TCP
                    hostIP: 192.168.10.2

  values:
    hostNetwork: false
    deployment:
      enabled: true
      kind: Deployment
      replicas: 1
    service:
      enabled: true
      single: true
      spec:
        type: ClusterIP
    updateStrategy:
      type: Recreate
    autoscaling:
      enabled: false
    rbac:
      enabled: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    podSecurityContext:
      fsGroup: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534

    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json
    metrics:
      prometheus:
        entryPoint: metrics

    providers:
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
      kubernetesCRD:
        enabled: true
      kubernetesGateway:
        enabled: true
      file:
        enabled: false

    ingressClass:
      enabled: true
    gatewayClass:
      enabled: true
    gateway:
      enabled: false

    ports:
      traefik:
        port: 18888
        expose:
          default: false
        exposedPort: 18888
        protocol: TCP
      metrics:
        port: 18889
        expose:
          default: false
        exposedPort: 18889
        protocol: TCP
      web:
        port: 7080
        hostPort: 80
        expose:
          default: true
        exposedPort: 80
      websecure:
        asDefault: true
        port: 7443
        hostPort: 443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
        http:
          tls:
            enabled: true
      wansecure:
        port: 8443
        hostPort: 8443
        expose:
          default: true
        exposedPort: 8443
        protocol: TCP
        http:
          tls:
            enabled: true
