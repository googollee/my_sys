---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: infra
  labels:
    app: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: matter-server
        image: ghcr.io/matter-js/matterjs-server:stable
        imagePullPolicy: Always
        env:
        - name: TZ
          value: 'Europe/Berlin'
        - name: PRIMARY_INTERFACE
          value: 'enp2s0.3'
        - name: ENABLE_TEST_NET_DCL
          value: 'true'
        - name: DISABLE_DASHBOARD
          value: 'true'
        - name: LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - containerPort: 5580
          hostPort: 5580
          protocol: TCP
          name: ws
        volumeMounts:
        - name: local-storage
          mountPath: /data
          subPath: matter-server
      volumes:
      - name: local-storage
        persistentVolumeClaim:
          claimName: local-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: matter-server
  namespace: infra
spec:
  type: ClusterIP
  selector:
    app: matter-server
  ports:
  - name: ws
    port: 5580
    protocol: TCP
    targetPort: 5580
