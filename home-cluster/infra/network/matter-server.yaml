---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: network
  labels:
    app: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: matter-server
        image: ghcr.io/matter-js/matterjs-server:stable
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        env:
        - name: TZ
          value: 'Europe/Berlin'
        - name: PRIMARY_INTERFACE
          value: 'enp2s0.3'
        - name: ENABLE_TEST_NET_DCL
          value: 'true'
        - name: DISABLE_DASHBOARD
          value: 'true'
        - name: LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - containerPort: 5580
          hostPort: 5580
          protocol: TCP
          name: ws
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: matter-data
---
apiVersion: v1
kind: Service
metadata:
  name: matter-server
  namespace: network
spec:
  type: ClusterIP
  selector:
    app: matter-server
  ports:
  - name: ws
    port: 5580
    protocol: TCP
    targetPort: 5580
---
apiVersion: 'v1'
kind: 'PersistentVolumeClaim'
metadata:
  name: 'matter-data'
  namespace: 'network'
spec:
  storageClassName: 'local-path'
  accessModes:
  - 'ReadWriteOnce'
  resources:
    requests:
      storage: '1Gi'
